<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Almanca kitap okurken dokunduğun her kelimeyi yapay zeka açıklasın.">
<title>Almanca Okuyucu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="btn-book-lib" aria-label="Kitaplığım" title="Kitaplığım">🗂️</button>
  <div class="brand" id="top-title">Almanca Okuyucu</div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-reader-opts" aria-label="Görünüm" title="Görünüm"><b>Aa</b></button>
    <button class="icon-btn" id="btn-settings" aria-label="Ayarlar" title="Ayarlar">⚙️</button>
  </div>
</header>

<main id="views">

  <!-- ================= KİTAP ================= -->
  <section class="view active" id="view-book" data-view="book">

    <div class="reader-stage" id="reader-stage">
      <article class="paper" id="paper" data-theme="sepia" lang="de">
        <div class="running-head" id="running-head" hidden>
          <span class="rh-t" id="rh-title"></span><span id="rh-num"></span>
        </div>
        <div class="flow" id="book-flow"></div>
        <div class="page-foot" id="page-foot" hidden></div>
      </article>

      <div class="empty-state" id="book-empty">
        <div class="big">📖</div>
        <h2>Almanca oku, kelimeleri öğren</h2>
        <p>Bir PDF, EPUB veya TXT dosyası yükle. Sonra metindeki <b>herhangi bir kelimeye dokun</b> —
           anlamını, eş anlamlılarını ve örnek cümlelerini göstereyim.</p>
        <label class="btn primary file-btn" style="margin-top:10px">
          📚 Dosya seç
          <input type="file" id="book-file" accept=".pdf,.epub,.txt,application/pdf,application/epub+zip,text/plain" hidden>
        </label>
        <p class="hint" id="book-status"></p>
      </div>
    </div>

    <div class="reader-bar" id="reader-bar" hidden>
      <button class="nav-btn" id="btn-prev" aria-label="Önceki sayfa">‹</button>
      <button class="chip grow" id="btn-toc">İçindekiler</button>
      <button class="nav-btn" id="btn-hardwords" aria-label="Zor kelimeler">✨</button>
      <button class="nav-btn" id="btn-next" aria-label="Sonraki sayfa">›</button>
    </div>
    <div class="book-progress" id="book-progress" hidden><span></span></div>
  </section>

  <!-- ================= KELİMELERİM ================= -->
  <section class="view" id="view-vocab" data-view="vocab">
    <div class="study-cta">
      <button class="btn primary" id="btn-flash">🎴 Tekrara başla</button>
    </div>
    <div class="toolbar wrap">
      <input type="search" id="vocab-search" placeholder="Kelime ara…" class="grow">
      <select class="select" id="vocab-sort" aria-label="Sırala">
        <option value="due">Tekrar sırasına göre</option>
        <option value="new">Önce yeni eklenen</option>
        <option value="az">A → Z</option>
      </select>
      <button class="chip" id="btn-vocab-export">⬇️ Dışa aktar</button>
      <label class="chip file-btn">⬆️ İçe aktar<input type="file" id="vocab-import" accept="application/json,.json" hidden></label>
    </div>
    <div id="vocab-stats" class="status"></div>
    <div id="vocab-list" class="vocab-list"></div>
  </section>

  <!-- ================= İSTATİSTİK ================= -->
  <section class="view" id="view-stats" data-view="stats">
    <div id="stats-body" class="stats-body"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-goto="book"><span>📖</span>Oku</button>
  <button class="tab" data-goto="vocab"><span>⭐</span>Kelimelerim</button>
  <button class="tab" data-goto="stats"><span>📊</span>İstatistik</button>
</nav>

<!-- tekrar çalışması (tam ekran) -->
<section class="study" id="study" hidden>
  <header class="study-top">
    <button class="icon-btn" id="study-close" aria-label="Kapat">✕</button>
    <div class="study-prog"><span id="study-prog-bar"></span></div>
    <div class="study-count" id="study-count"></div>
  </header>
  <div class="study-body" id="study-body"></div>
</section>

<!-- kelime paneli -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<aside class="sheet" id="word-sheet" hidden aria-live="polite">
  <div class="sheet-handle"><span></span></div>
  <div class="sheet-body" id="word-sheet-body"></div>
</aside>

<!-- seçimi açıkla butonu -->
<button class="floating-sel" id="sel-btn" hidden>Seçimi açıkla</button>

<!-- modal -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="modal-title">Başlık</h2><button class="icon-btn" id="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
